# .pre-commit-config.yaml — bloqueia dados pessoais e segredos antes do commit
# Instalação: pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4   # conferir a versão mais recente
    hooks:
      - id: gitleaks
        args: ["--config=gitleaks.toml"]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0    # conferir a versão mais recente
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: detect-private-key
      - id: check-yaml
      - id: check-json
